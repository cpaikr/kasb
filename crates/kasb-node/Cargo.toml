[package]
name = "kasb-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "kasb-process-probe"
path = "src/bin/kasb-process-probe.rs"

[features]
default = []
feasibility-judge = []

[dependencies]
futures-util.workspace = true
kasb = { path = "../kasb" }
napi.workspace = true
napi-derive.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"

[build-dependencies]
napi-build.workspace = true
