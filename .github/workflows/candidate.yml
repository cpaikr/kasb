name: Canonical release candidate

on:
  pull_request:
    paths:
      - ".github/workflows/candidate.yml"
      - ".github/workflows/release.yml"
      - "scripts/**"
      - "fixtures/release/**"
      - "native-targets.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - "packages/**"
      - "installers/**"
      - "docs/release.md"
      - "plans/canonical-release-pipeline.md"
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      candidate_ref:
        required: true
        type: string
      candidate_sha:
        required: true
        type: string
      publication_state_artifact:
        required: false
        type: string
        default: ""
    outputs:
      candidate_artifact_id:
        value: ${{ jobs.aggregate.outputs.artifact_id }}
      candidate_artifact_digest:
        value: ${{ jobs.aggregate.outputs.artifact_digest }}
      candidate_artifact_name:
        value: release-candidate
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Bind candidate identity
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      mode: ${{ steps.identity.outputs.mode }}
      ref: ${{ steps.identity.outputs.ref }}
      sha: ${{ steps.identity.outputs.sha }}
    steps:
      - name: Resolve immutable candidate identity
        id: identity
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_REF: ${{ inputs.candidate_ref }}
          REQUESTED_SHA: ${{ inputs.candidate_sha }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mode="${REQUESTED_MODE:-rehearsal}"
          sha="${REQUESTED_SHA:-${PR_SHA:-$GITHUB_SHA}}"
          ref="${REQUESTED_REF:-refs/kasb-rehearsal/$sha}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "candidate SHA must be a full lowercase commit identity" >&2; exit 1; }
          [[ "$mode" == rehearsal || "$mode" == strict ]] || { echo "invalid candidate mode" >&2; exit 1; }
          if [[ ("$GITHUB_EVENT_NAME" == pull_request || "$GITHUB_EVENT_NAME" == workflow_dispatch) && "$mode" != rehearsal ]]; then
            echo "pull-request and manual candidates are rehearsal-only" >&2
            exit 1
          fi
          [[ "$mode" != rehearsal || "$ref" == "refs/kasb-rehearsal/$sha" ]] || { echo "invalid rehearsal ref" >&2; exit 1; }
          [[ "$mode" != strict || "$ref" == refs/tags/v* ]] || { echo "strict candidates require a version tag" >&2; exit 1; }
          {
            echo "mode=$mode"
            echo "ref=$ref"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"
      - name: Check out exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.identity.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Download strict publication snapshot
        if: steps.identity.outputs.mode == 'strict'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.publication_state_artifact }}
          path: dist/release/state
      - name: Validate candidate before expensive work
        shell: bash
        env:
          MODE: ${{ steps.identity.outputs.mode }}
          CANDIDATE_REF: ${{ steps.identity.outputs.ref }}
          CANDIDATE_SHA: ${{ steps.identity.outputs.sha }}
        run: |
          set -euo pipefail
          state=fixtures/release/publication-vacant.json
          [[ "$MODE" == rehearsal ]] || state=dist/release/state/publication-state.json
          node scripts/validate-release-candidate.mjs --mode "$MODE" --ref "$CANDIDATE_REF" --sha "$CANDIDATE_SHA" --publication-state "$state" --output dist/release/candidate-metadata.json

  deterministic:
    name: Deterministic release gates
    needs: metadata
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Check out exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Set up Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.88.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate contracts and generated state
        run: bun run contracts:check && bun run native:check && node scripts/validate-release-workflows.mjs
      - name: Install cargo-about
        run: cargo install cargo-about --version 0.9.2 --locked --features cli
      - name: Validate licenses
        run: bun run licenses:check
      - name: Typecheck
        run: bun run typecheck
      - name: Test products and installer contracts
        env:
          KASB_REQUIRE_POWERSHELL_TESTS: "1"
        run: bun run test
      - name: Run adversarial conformance
        run: bun run conformance:judge
      - name: Build all products
        run: bun run build
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Check Rust lints
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  root-package:
    name: Build immutable root npm tarball
    needs: [metadata, deterministic]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Check out exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Build and pack once
        run: |
          bun install --frozen-lockfile
          bun run build:node
          mkdir -p dist/root
          npm pack ./packages/node --ignore-scripts --pack-destination dist/root
      - name: Upload root tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: candidate-root-package
          path: dist/root/*.tgz
          if-no-files-found: error
          retention-days: 7

  native-linux:
    name: Candidate ${{ matrix.rust_target }} at glibc 2.28
    needs: [metadata, deterministic, root-package]
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust_target: x86_64-unknown-linux-gnu
            runner: blacksmith-2vcpu-ubuntu-2404
            package_directory: linux-x64-gnu
            build_container: quay.io/pypa/manylinux_2_28_x86_64:2026.08.15-1@sha256:0c87ccb5996dab6c3b7612ee4fda7b80c4ab3c44a86c2541e4a872afdf4f131b
          - rust_target: aarch64-unknown-linux-gnu
            runner: blacksmith-2vcpu-ubuntu-2404-arm
            package_directory: linux-arm64-gnu
            build_container: quay.io/pypa/manylinux_2_28_aarch64:2026.08.15-1@sha256:561427136aabf3787bffb294b3515748241e0962d1527ae28bea1e076bfb9d99
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.build_container }}
    steps:
      - name: Install Linux build prerequisites
        run: dnf install -y clang-devel cmake curl git ninja-build perl-core pkgconf-pkg-config
      - name: Check out exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          persist-credentials: false
      - name: Build and validate target
        uses: ./.github/actions/build-release-target
        with:
          candidate_sha: ${{ needs.metadata.outputs.sha }}
          candidate_ref: ${{ needs.metadata.outputs.ref }}
          rust_target: ${{ matrix.rust_target }}
          package_directory: ${{ matrix.package_directory }}
          root_artifact: candidate-root-package
          enforce_glibc: "true"
          declared_runner: ${{ matrix.runner }}
          build_image: ${{ matrix.build_container }}

  native-portable:
    name: Candidate ${{ matrix.rust_target }}
    needs: [metadata, deterministic, root-package]
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust_target: aarch64-apple-darwin
            runner: macos-15
            package_directory: darwin-arm64
          - rust_target: x86_64-pc-windows-msvc
            runner: windows-2025
            package_directory: win32-x64-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          persist-credentials: false
      - name: Build and validate target
        uses: ./.github/actions/build-release-target
        with:
          candidate_sha: ${{ needs.metadata.outputs.sha }}
          candidate_ref: ${{ needs.metadata.outputs.ref }}
          rust_target: ${{ matrix.rust_target }}
          package_directory: ${{ matrix.package_directory }}
          root_artifact: candidate-root-package
          enforce_glibc: "false"
          declared_runner: ${{ matrix.runner }}

  aggregate:
    name: Validate complete four-target candidate
    needs: [metadata, deterministic, root-package, native-linux, native-portable]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Check out exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Download root tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: candidate-root-package
          path: dist/root
      - name: Download all target artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: candidate-target-*
          merge-multiple: true
          path: dist
      - name: Download strict publication snapshot
        if: needs.metadata.outputs.mode == 'strict'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.publication_state_artifact }}
          path: dist/release/state
      - name: Validate aggregate and create manifest
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.metadata.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist/installers dist/release dist/provenance
          cp installers/install.sh installers/install.ps1 dist/installers/
          version=$(node -p "require('./packages/node/package.json').version")
          expected_targets=$(jq -c '[.targets[].rustTarget] | sort' native-targets.json)
          jq -se \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg version "$version" \
            --arg sourceRef "${{ needs.metadata.outputs.ref }}" \
            --arg commit "$CANDIDATE_SHA" \
            --argjson expectedTargets "$expected_targets" \
            'length == 4 and ([.[].target] | unique | sort) == $expectedTargets and all(.[]; .schemaVersion == 1 and .repository == $repository and .version == $version and .sourceRef == $sourceRef and .commit == $commit and (.runner.label | length > 0) and (.runner.os | length > 0) and (.runner.arch | length > 0))' \
            dist/provenance/fragments/*.json >/dev/null
          jq -s --arg repository "$GITHUB_REPOSITORY" --arg commit "$CANDIDATE_SHA" \
            --arg version "$version" --arg sourceRef "${{ needs.metadata.outputs.ref }}" \
            '{schemaVersion:1,repository:$repository,version:$version,sourceRef:$sourceRef,commit:$commit,targets:sort_by(.target)}' \
            dist/provenance/fragments/*.json > dist/provenance/provenance.json
          node scripts/write-release-checksums.mjs --candidate
          node scripts/validate-release-artifacts.mjs
          node scripts/write-release-candidate-manifest.mjs --sha "$CANDIDATE_SHA"
      - name: Reconcile post-build candidate metadata
        shell: bash
        env:
          MODE: ${{ needs.metadata.outputs.mode }}
          CANDIDATE_REF: ${{ needs.metadata.outputs.ref }}
          CANDIDATE_SHA: ${{ needs.metadata.outputs.sha }}
        run: |
          set -euo pipefail
          state=fixtures/release/publication-vacant.json
          [[ "$MODE" == rehearsal ]] || state=dist/release/state/publication-state.json
          node scripts/validate-release-candidate.mjs --mode "$MODE" --ref "$CANDIDATE_REF" --sha "$CANDIDATE_SHA" --publication-state "$state" --artifact-manifest dist/release/artifact-manifest.json --output dist/release/candidate-metadata.json
      - name: Upload validated candidate
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-candidate
          path: |
            dist/root/*.tgz
            dist/native/*.tgz
            dist/cli/*.tar.gz
            dist/cli/SHA256SUMS
            dist/installers/install.sh
            dist/installers/install.ps1
            dist/provenance/provenance.json
            dist/release/artifact-manifest.json
            dist/release/candidate-metadata.json
          if-no-files-found: error
          retention-days: 7
