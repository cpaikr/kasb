name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/rust-node-rewrite-integration

permissions:
  contents: read

jobs:
  deterministic:
    name: Deterministic validation
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Set up Rust 1.88
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.88.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate contracts and generated metadata
        run: bun run contracts:check && bun run native:check
      - name: Install cargo-about
        run: cargo install cargo-about --version 0.9.2 --locked --features cli
      - name: Validate third-party notices
        run: bun run licenses:check
      - name: Typecheck
        run: bun run typecheck
      - name: Test Rust and Node products
        env:
          KASB_REQUIRE_POWERSHELL_TESTS: "1"
        run: bun run test
      - name: Run adversarial public-surface judge
        run: bun run conformance:judge
      - name: Build Rust and Node products
        run: bun run build
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Check Rust lints
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  windows-release-contract:
    name: Windows release contract
    runs-on: blacksmith-2vcpu-windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Set up Rust 1.88
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.88.0
          components: clippy
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Compile and test the Windows upgrade protocol
        run: cargo test --locked -p kasb-cli --lib
      - name: Lint the Windows CLI target
        run: cargo clippy --locked -p kasb-cli --all-targets -- -D warnings
      - name: Test the PowerShell installer behavior
        env:
          KASB_REQUIRE_POWERSHELL_TESTS: "1"
        run: node scripts/test-installers.mjs --powershell-only --build-windows-cli

  root-package:
    name: Immutable root npm package
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build root package
        run: bun run build:node
      - name: Pack root package
        run: mkdir -p dist/root && npm pack ./packages/node --ignore-scripts --pack-destination dist/root
      - name: Upload root package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: root-package
          path: dist/root/*.tgz
          if-no-files-found: error

  native-linux:
    name: Native ${{ matrix.rust_target }} at glibc 2.28
    # macOS ARM64 and Windows x64 native package builds remain deliberately
    # omitted from continuous CI to reduce compute cost. The separate Windows
    # job compiles the CLI and tests release mechanics, not packaged artifacts.
    needs: root-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust_target: x86_64-unknown-linux-gnu
            runner: blacksmith-2vcpu-ubuntu-2404
            package_directory: linux-x64-gnu
            build_container: quay.io/pypa/manylinux_2_28_x86_64:2026.08.15-1@sha256:0c87ccb5996dab6c3b7612ee4fda7b80c4ab3c44a86c2541e4a872afdf4f131b
          - rust_target: aarch64-unknown-linux-gnu
            runner: blacksmith-2vcpu-ubuntu-2404-arm
            package_directory: linux-arm64-gnu
            build_container: quay.io/pypa/manylinux_2_28_aarch64:2026.08.15-1@sha256:561427136aabf3787bffb294b3515748241e0962d1527ae28bea1e076bfb9d99
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.build_container }}
    steps:
      - name: Install Linux build prerequisites
        run: dnf install -y clang-devel cmake curl git ninja-build perl-core pkgconf-pkg-config
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up packaging Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Set up Rust 1.88 target
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.88.0
          target: ${{ matrix.rust_target }}
      - name: Check native package metadata
        run: node scripts/generate-native-packages.mjs --check && node scripts/validate-glibc-floor.mjs --self-test
      - name: Build same-revision addon and Rust CLI
        shell: bash
        run: |
          cargo build --locked --release --target ${{ matrix.rust_target }} -p kasb-node --lib --bin kasb-process-probe
          cargo build --locked --release --target ${{ matrix.rust_target }} -p kasb-cli --bin kasb
      - name: Assemble target package
        run: node scripts/assemble-native-package.mjs ${{ matrix.rust_target }}
      - name: Enforce the glibc 2.28 runtime and symbol floor
        run: node scripts/validate-glibc-floor.mjs ${{ matrix.rust_target }}
      - name: Pack target artifact
        shell: bash
        run: |
          mkdir -p dist/native
          npm pack "./packages/native/${{ matrix.package_directory }}" --ignore-scripts --pack-destination dist/native
      - name: Assemble direct CLI archive
        run: node scripts/assemble-cli-archive.mjs ${{ matrix.rust_target }}
      - name: Download immutable root package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: root-package
          path: dist/root
      - name: Use Node 20.18.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20.18.1
      - name: Test packed consumer on Node 20.18.1
        run: node scripts/test-native-consumer.mjs ${{ matrix.rust_target }} dist/root dist/native
      - name: Use Node 21
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 21
      - name: Test packed consumer on Node 21
        run: node scripts/test-native-consumer.mjs ${{ matrix.rust_target }} dist/root dist/native
      - name: Use Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Test packed consumer on Node 22
        run: node scripts/test-native-consumer.mjs ${{ matrix.rust_target }} dist/root dist/native
      - name: Use Node 23
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 23
      - name: Test packed consumer on Node 23
        run: node scripts/test-native-consumer.mjs ${{ matrix.rust_target }} dist/root dist/native
      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Test packed consumer on Node 24
        run: node scripts/test-native-consumer.mjs ${{ matrix.rust_target }} dist/root dist/native dist/cli
      - name: Use Node 25
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 25
      - name: Test packed consumer on Node 25
        run: node scripts/test-native-consumer.mjs ${{ matrix.rust_target }} dist/root dist/native
      - name: Use Node 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
      - name: Test packed consumer on Node 26
        run: node scripts/test-native-consumer.mjs ${{ matrix.rust_target }} dist/root dist/native
      - name: Upload target artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-${{ matrix.rust_target }}
          path: dist/native/*.tgz
          if-no-files-found: error
      - name: Upload direct CLI archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-${{ matrix.rust_target }}
          path: dist/cli/*.tar.gz
          if-no-files-found: error

  artifact-set:
    name: Complete CI native artifact set
    needs: [root-package, native-linux]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Download native artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: native-*
          merge-multiple: true
          path: dist/native
      - name: Download immutable root package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: root-package
          path: dist/root
      - name: Download direct CLI archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist/cli
      - name: Validate continuously tested artifact set
        run: node scripts/write-release-checksums.mjs --ci && node scripts/validate-release-artifacts.mjs --ci
