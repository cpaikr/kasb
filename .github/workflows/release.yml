name: Canonical release publication

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: canonical-release
  cancel-in-progress: false

jobs:
  publication-state:
    name: Protected immutable-release preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: github-release
    permissions:
      contents: read
    outputs:
      artifact_name: strict-publication-state
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Require configured GitHub release environment
        shell: bash
        env:
          RELEASE_ENVIRONMENT_SENTINEL: ${{ secrets.KASB_GITHUB_RELEASE_SENTINEL }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_ENVIRONMENT_SENTINEL" == "github-release:v1" ]]
      - name: Check out immutable tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Pin npm inspection CLI
        run: npm install --global npm@11.6.2
      - name: Mint fresh read-only release-policy token
        id: release-policy-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.KASB_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.KASB_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: kasb
          permission-administration: read
          permission-contents: read
      - name: Verify tag and capture fresh vacant state
        env:
          GH_TOKEN: ${{ steps.release-policy-token.outputs.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/tags/$GITHUB_REF_NAME" ]]
          [[ "$(git rev-list -n 1 "$GITHUB_REF_NAME")" == "$GITHUB_SHA" ]]
          node scripts/capture-release-publication-state.mjs --commit "$GITHUB_SHA"
      - name: Upload immutable state snapshot
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: strict-publication-state
          path: dist/release/publication-state.json
          if-no-files-found: error
          retention-days: 7

  candidate:
    name: Build and validate complete candidate
    needs: publication-state
    uses: ./.github/workflows/candidate.yml
    with:
      mode: strict
      candidate_ref: ${{ github.ref }}
      candidate_sha: ${{ github.sha }}
      publication_state_artifact: ${{ needs.publication-state.outputs.artifact_name }}
    permissions:
      contents: read

  github-release:
    name: Execute exact immutable GitHub publication
    needs: [publication-state, candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: github-release
    permissions:
      contents: write
    outputs:
      receipt_artifact_id: ${{ steps.receipt.outputs.artifact-id }}
      receipt_artifact_digest: ${{ steps.receipt.outputs.artifact-digest }}
    steps:
      - name: Seed truthful GitHub publication receipt
        shell: bash
        env:
          PUBLICATION_RECEIPT: ${{ runner.temp }}/github-publication-receipt.json
        run: |
          printf '%s\n' '{"schemaVersion":1,"ok":false,"channel":"github","operations":[],"error":{"code":"not_started","message":"GitHub publication did not start"}}' > "$PUBLICATION_RECEIPT"
      - name: Require configured GitHub release environment
        shell: bash
        env:
          RELEASE_ENVIRONMENT_SENTINEL: ${{ secrets.KASB_GITHUB_RELEASE_SENTINEL }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_ENVIRONMENT_SENTINEL" == "github-release:v1" ]]
      - name: Check out exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Pin npm inspection CLI
        run: npm install --global npm@11.6.2
      - name: Download validated candidate by immutable artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.candidate.outputs.candidate_artifact_id }}
          path: dist
      - name: Download protected immutability confirmation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.publication-state.outputs.artifact_id }}
          path: dist/release/state
      - name: Revalidate every downloaded candidate file
        run: |
          node scripts/validate-release-candidate.mjs \
            --mode strict \
            --ref "$GITHUB_REF" \
            --sha "$GITHUB_SHA" \
            --publication-state dist/release/state/publication-state.json \
            --artifact-manifest dist/release/artifact-manifest.json \
            --output dist/release/candidate.json
      - name: Record server-computed artifact digests
        env:
          CANDIDATE_DIGEST: ${{ needs.candidate.outputs.candidate_artifact_digest }}
          PREFLIGHT_DIGEST: ${{ needs.publication-state.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ || "$CANDIDATE_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PREFLIGHT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ || "$PREFLIGHT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          echo "Recorded candidate artifact digest: $CANDIDATE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Recorded preflight artifact digest: $PREFLIGHT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Mint fresh read-only release-policy token
        id: release-policy-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.KASB_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.KASB_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: kasb
          permission-administration: read
          permission-contents: read
      - name: Invoke deterministic tested GitHub executor
        env:
          GH_TOKEN: ${{ github.token }}
          KASB_RELEASE_POLICY_TOKEN: ${{ steps.release-policy-token.outputs.token }}
          PUBLICATION_RECEIPT: ${{ runner.temp }}/github-publication-receipt.json
        run: |
          printf '%s\n' '{"schemaVersion":1,"ok":false,"channel":"github","operations":[],"error":{"code":"outcome_unknown","message":"GitHub publication began but did not produce a final receipt"}}' > "$PUBLICATION_RECEIPT"
          node scripts/execute-release-publication.mjs \
            --channel github \
            --candidate dist/release/candidate.json \
            --output "$PUBLICATION_RECEIPT"
      - name: Upload truthful GitHub publication receipt
        id: receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: github-publication-receipt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/github-publication-receipt.json
          if-no-files-found: error
          retention-days: 30

  npm-release:
    name: Execute exact npm projection through trusted publishing
    needs: [publication-state, candidate, github-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Seed truthful npm publication receipt
        shell: bash
        env:
          PUBLICATION_RECEIPT: ${{ runner.temp }}/npm-publication-receipt.json
        run: |
          printf '%s\n' '{"schemaVersion":1,"ok":false,"channel":"npm","operations":[],"error":{"code":"not_started","message":"npm publication did not start"}}' > "$PUBLICATION_RECEIPT"
      - name: Require configured npm release environment
        shell: bash
        env:
          RELEASE_ENVIRONMENT_SENTINEL: ${{ secrets.KASB_NPM_RELEASE_SENTINEL }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_ENVIRONMENT_SENTINEL" == "npm-release:v1" ]]
      - name: Check out exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node 24 for npm trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Pin trusted-publishing npm CLI
        run: npm install --global npm@11.6.2
      - name: Download the same validated candidate by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.candidate.outputs.candidate_artifact_id }}
          path: dist
      - name: Download protected immutability confirmation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.publication-state.outputs.artifact_id }}
          path: dist/release/state
      - name: Revalidate every downloaded candidate file
        run: |
          node scripts/validate-release-candidate.mjs \
            --mode strict \
            --ref "$GITHUB_REF" \
            --sha "$GITHUB_SHA" \
            --publication-state dist/release/state/publication-state.json \
            --artifact-manifest dist/release/artifact-manifest.json \
            --output dist/release/candidate.json
      - name: Download exact immutable GitHub receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.github-release.outputs.receipt_artifact_id }}
          path: dist/release/github
      - name: Reverify exact immutable GitHub release, then invoke npm executor
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_DIGEST: ${{ needs.candidate.outputs.candidate_artifact_digest }}
          PREFLIGHT_DIGEST: ${{ needs.publication-state.outputs.artifact_digest }}
          GITHUB_RECEIPT_DIGEST: ${{ needs.github-release.outputs.receipt_artifact_digest }}
          PUBLICATION_RECEIPT: ${{ runner.temp }}/npm-publication-receipt.json
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ || "$CANDIDATE_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PREFLIGHT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ || "$PREFLIGHT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$GITHUB_RECEIPT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ || "$GITHUB_RECEIPT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          node scripts/capture-release-publication-state.mjs --commit "$GITHUB_SHA" --verify-immutable-release-only true
          node scripts/plan-github-publication.mjs --state dist/release/publication-state.json --phase verify
          jq -e '.ok and .status == "published" and (.actions | length == 0)' dist/release/github-publication-plan.json >/dev/null
          printf '%s\n' '{"schemaVersion":1,"ok":false,"channel":"npm","operations":[],"error":{"code":"outcome_unknown","message":"npm publication began but did not produce a final receipt"}}' > "$PUBLICATION_RECEIPT"
          node scripts/execute-release-publication.mjs \
            --channel npm \
            --candidate dist/release/candidate.json \
            --github-receipt dist/release/github/github-publication-receipt.json \
            --output "$PUBLICATION_RECEIPT"
      - name: Upload truthful npm publication receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-publication-receipt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-publication-receipt.json
          if-no-files-found: error
          retention-days: 30
