name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing source tag to publish, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      package_name: ${{ steps.package.outputs.package_name }}
      package_version: ${{ steps.package.outputs.package_version }}
      public_release_tag: ${{ steps.package.outputs.public_release_tag }}
      source_tag: ${{ steps.package.outputs.source_tag }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Read package metadata
        id: package
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SOURCE_TAG="$DISPATCH_TAG"
          else
            SOURCE_TAG="$GITHUB_REF_NAME"
          fi

          if [ "$SOURCE_TAG" != "v$PACKAGE_VERSION" ]; then
            echo "Tag $SOURCE_TAG does not match package version v$PACKAGE_VERSION." >&2
            exit 1
          fi

          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "public_release_tag=kasb-v$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "source_tag=$SOURCE_TAG" >> "$GITHUB_OUTPUT"

  npm_validation:
    runs-on: ubuntu-latest
    needs: metadata

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.source_tag }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build npm CLI bundle
        run: bun run build

  binary_assets:
    name: Build ${{ matrix.name }} binary
    needs: metadata
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: bun-linux-x64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: bun-linux-arm64
          # GitHub-hosted macos-13 Intel runners can remain queued indefinitely,
          # which blocks the publish job. Ship the current macOS arm64 target only.
          - name: macos-arm64
            os: macos-14
            target: bun-darwin-arm64
          - name: windows-x64
            os: windows-latest
            target: bun-windows-x64
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.source_tag }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and smoke test standalone binary release asset
        run: bun run build:binaries --target ${{ matrix.target }} --outdir dist-bin/${{ matrix.target }} --smoke-test

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: dist-bin/${{ matrix.target }}/release/kasb-v${{ needs.metadata.outputs.package_version }}-*
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs:
      - metadata
      - npm_validation
      - binary_assets
    permissions:
      contents: read
      id-token: write
    env:
      PACKAGE_NAME: ${{ needs.metadata.outputs.package_name }}
      PACKAGE_VERSION: ${{ needs.metadata.outputs.package_version }}
      PUBLIC_RELEASE_TAG: ${{ needs.metadata.outputs.public_release_tag }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.source_tag }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node for npm publishing
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use pinned npm with trusted publishing support
        run: |
          npm install --global npm@11.6.2
          npm --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build npm CLI bundle
        run: bun run build

      - name: Download binary release archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist-bin/release
          merge-multiple: true

      - name: Generate combined checksums
        run: |
          node --input-type=module <<'EOF'
          import { createHash } from "node:crypto";
          import { readdirSync, readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";

          const releaseDir = "dist-bin/release";
          const files = readdirSync(releaseDir)
            .filter((file) => file !== "checksums.txt")
            .sort();
          const checksums = files.map((file) => {
            const hash = createHash("sha256").update(readFileSync(join(releaseDir, file))).digest("hex");
            return `${hash}  ${file}`;
          });

          writeFileSync(join(releaseDir, "checksums.txt"), `${checksums.join("\n")}\n`);
          EOF

      - name: Publish npm package
        run: |
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published; skipping npm publish."
          else
            npm publish --access public
          fi

      - name: Upload assets to public GitHub Release
        run: |
          if gh release view "$PUBLIC_RELEASE_TAG" --repo open-creo/open-creo >/dev/null 2>&1; then
            gh release upload "$PUBLIC_RELEASE_TAG" dist-bin/release/* \
              --repo open-creo/open-creo \
              --clobber
          else
            gh release create "$PUBLIC_RELEASE_TAG" dist-bin/release/* \
              --repo open-creo/open-creo \
              --title "kasb v$PACKAGE_VERSION" \
              --notes "Standalone kasb binaries for $PACKAGE_NAME@$PACKAGE_VERSION. The npm package is published separately."
          fi
        env:
          GH_TOKEN: ${{ secrets.OPEN_CREO_RELEASE_TOKEN }}
